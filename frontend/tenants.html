<body>
    <h2>Add Tenant Information</h2>

      <tr>
        <th>User ID</th>
        <th>Tenant ID</th>
        <th>Occupation</th>
      </tr>
    </thead>
    <tbody>
      <!-- Data will be inserted here -->

  <form id="tenantForm">

    <input type="number" id="tenant_id" name="tenant_id" required /><br/><br/>

  </form>
    <div id="loadingIndicator">
