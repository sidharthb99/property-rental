<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Management</title>
    <link rel="stylesheet" href="css/user.css">
</head>
<body>
    <h2>Property Listings</h2>
    <table id="propertytable">
        <thead>
            <tr>
                <th>PropertyID</th>
                <th>OwnerId</th>
                <th>Title</th>
                <th>Description</th>
                <th>Address</th>
                <th>CityId</th>
                <th>Rent</th>
                <th>Status</th>
                <th>Created_At</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <h2>Add New Property</h2>
    <form id="propertyForm">
        <label for="owner_id">Owner ID</label>
        <input type="number" id="owner_id" name="owner_id" required />

        <label for="title">Title</label>
        <input type="text" id="title" name="title" required />

        <label for="description">Description</label>
        <textarea id="description" name="description"></textarea>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" required />

        <label for="city_id">City ID</label>
        <input type="number" id="city_id" name="city_id" required />

        <label for="price_per_month">Price Per Month</label>
        <input type="number" step="0.01" id="price_per_month" name="price_per_month" required />

        <label for="status">Status</label>
        <select id="status" name="status">
            <option value="available">Available</option>
            <option value="booked">Booked</option>
            <option value="inactive">Inactive</option>
        </select>

        <button type="submit">Submit</button>
    </form>

    <div id="loadingIndicator">
        <div class="spinner"></div>
        <span>Loading... Please wait.</span>
    </div>

    <script src="JS/properties.js"></script>
</body>
</html>
